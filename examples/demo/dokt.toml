# Example project for dokt. From this folder:
#
#   dokt serve                # live preview on http://127.0.0.1:3000
#   dokt export --web --pdf   # the static site and a PDF, both in dist-docs/
#
# Every setting is explained in the top-level README. `dokt init` writes a
# fuller, commented file for your own project.

title = "Acme Docs"
out_dir = "dist-docs"

# Only these files are considered. Images used by a page (such as media/outside.png,
# embedded from docs/guide/setup.md) are copied even though they are not listed.
include = ["README.md", "TODO.md", "docs/**", "packages/*/README.md", "packages/*/docs/**", "notes/**"]

# Skipped even though `docs/**` and friends would otherwise match nothing in it.
exclude = ["drafts/"]

# Applied after the built-in styles, and to the PDF as well.
css = ["branding/docs.css"]

[todos]
# Highlight and collect these words. TODO.md is always treated as a task list.
markers = ["TODO", "FIXME"]

[brand]
logo = "branding/logo.svg"            # light theme
logo_dark = "branding/logo-dark.svg"  # dark theme
favicon = "branding/favicon.png"
footer = "Acme Docs - generated by dokt"

[export]
paper = "a4"   # or "letter"

[theme]
toggle = true  # show the light/dark button

# Only the colors that differ from the defaults need to be listed.
[theme.light]
accent = "#c2255c"
todo   = "#ffe066"

[theme.dark]
accent = "#ff8fab"
